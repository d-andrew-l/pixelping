<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelPing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%23241a33'/><rect x='1' y='5' width='1' height='2' fill='%233fd9a5'/><rect x='3' y='3' width='1' height='4' fill='%234fb3ff'/><rect x='5' y='1' width='1' height='6' fill='%23ff4f8b'/></svg>">
<script src="/static/pixel.js"></script>
<style>
/* PixelPing, pixel edition (toned down): Parts Bin's palette, pixel frames and planets as accents,
   Atkinson Hyperlegible for every number so the data stays easy to read. Fonts are bundled in /static. */
@font-face { font-family: "Pixelify Sans"; font-weight: 500; font-display: swap; src: url(/static/fonts/pixelify-sans-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Pixelify Sans"; font-weight: 700; font-display: swap; src: url(/static/fonts/pixelify-sans-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url(/static/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: swap; src: url(/static/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2"); }

:root {
  color-scheme: light;
  --page: #fbf5ea; --panel: #fffdf8; --panel-2: #f6eedf; --hover: #fff3cf;
  --ink: #241a33; --ink-2: #463a58; --muted: #6f6382;
  --grid: #e6dccb; --axis: #b9adc9; --line: rgb(36 26 51 / 0.12);
  --edge: #3a2f4d; --shade: rgb(36 26 51 / 0.14);
  --s1: #3d8fd6; --s2: #e2557f; --s3: #2fae84; --s4: #d69a12; --s5: #8a63e0;
  --good: #2fae84; --warning: #d99a00; --serious: #ef7a3a; --critical: #df4747;
  --accent: #ffcf3f;
  --pw: 2px;
  --pixel: "Pixelify Sans", ui-monospace, monospace;
  --read: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #1b1733; --panel: #251f45; --panel-2: #2d2652; --hover: #362e62;
  --ink: #f6eedf; --ink-2: #ded4ec; --muted: #ada2c4;
  --grid: #352d5c; --axis: #554a80; --line: rgb(246 238 223 / 0.12);
  --edge: #0b0818; --shade: rgb(5 3 15 / 0.45);
  --s1: #5aaaf0; --s2: #ff6f98; --s3: #3fd9a5; --s4: #f2b631; --s5: #a787ff;
  --good: #3fd9a5; --warning: #f2b631; --serious: #ff9150; --critical: #ff6464;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 var(--read); }
.spacer { flex: 1; }
button { font: inherit; color: inherit; }

/* the pixel frame: hard 2px edges with notched corners + a soft stepped shadow */
.px, .panel, .plate, .tbtn, .seg button, #tip {
  --e: var(--edge);
  box-shadow:
    0 calc(var(--pw) * -1) 0 0 var(--e), 0 var(--pw) 0 0 var(--e),
    calc(var(--pw) * -1) 0 0 0 var(--e), var(--pw) 0 0 0 var(--e),
    calc(var(--pw) * 2) calc(var(--pw) * 2) 0 0 var(--shade);
  border: 0; border-radius: 0;
}

/* header: pixel sky with one planet per host */
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  min-height: 84px; padding: 12px 24px; background: #7ecbff var(--banner, none) left center / 100% 100% no-repeat;
  border-bottom: var(--pw) solid var(--edge); image-rendering: pixelated; }
:root[data-theme="dark"] header { background-color: #1d1850; }
.plate { background: var(--panel); padding: 7px 14px; display: flex; align-items: center; gap: 12px; }
h1 { margin: 0; font: 700 24px/1 var(--pixel); letter-spacing: .02em; }
.strap { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.conn { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.seg { display: inline-flex; gap: 8px; }
.seg button, .tbtn { background: var(--panel); padding: 6px 12px; cursor: pointer; font: 700 13.5px/1.2 var(--read); }
.seg button:hover, .tbtn:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #241a33; }
.seg button:active, .tbtn:active { transform: translate(var(--pw), var(--pw)); }
.seg button:focus-visible, .tbtn:focus-visible { outline: none; --e: var(--s2); }

main { padding: 26px 26px 40px; max-width: 1800px; margin: 0 auto; display: grid; gap: 24px; }
.panel { background: var(--panel); padding: 16px 18px; }
h2 { font: 500 20px/1.2 var(--pixel); margin: 0 0 12px; }
h2 small { font: 400 13px var(--read); color: var(--muted); margin-left: 8px; }

/* status: a small pixel square + text, never colour alone */
.dot { width: 10px; height: 10px; display: inline-block; flex: none; box-shadow: 0 0 0 2px var(--edge); }
.status { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }

/* health matrix */
.table-wrap { overflow-x: auto; }
.health { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.health th, .health td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.health thead th { border-top: 0; background: var(--panel-2); color: var(--ink-2); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; border-bottom: var(--pw) solid var(--edge); }
.health tbody th { font-weight: 700; white-space: nowrap; }
.health tbody th img { width: 28px; height: 28px; vertical-align: middle; margin-right: 8px; image-rendering: pixelated; }
.health td .v { font-weight: 700; }
.sub { color: var(--muted); font-size: 12.5px; }

/* hosts */
.hosts { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 24px; }
.host-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.host-head img { width: 56px; height: 56px; image-rendering: pixelated; margin: -6px 0; }
.host-head h3 { margin: 0; font: 700 22px/1.1 var(--pixel); }
.host-head .meta { color: var(--muted); font-size: 12.5px; }
.offline { color: var(--critical); font-size: 13px; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 14px;
  background: var(--panel-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tile { padding: 10px 12px; min-width: 0; }
.tile + .tile { border-left: 1px solid var(--line); }
.tile .k { color: var(--ink-2); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  display: flex; align-items: center; gap: 7px; }
.tile .k .dot { width: 8px; height: 8px; }
.tile .n { font-size: 24px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .u { font-size: 12.5px; color: var(--ink-2); font-weight: 400; margin-left: 3px; }
.chart-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin: 10px 0 4px; }
.chart-title b { font: 500 15px var(--pixel); color: var(--ink); margin-right: auto; }
.legend { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 4px; display: inline-block; }
.legend i.band { height: 10px; width: 10px; opacity: .5; background-image: repeating-linear-gradient(45deg, transparent 0 2px, var(--panel) 2px 4px) !important; }
canvas { display: block; width: 100%; height: 150px; image-rendering: pixelated; }
.conns { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 12px; table-layout: fixed; }
.conns th { text-align: left; color: var(--ink-2); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 5px 6px; }
.conns td { padding: 5px 6px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conns .num { text-align: right; width: 88px; }
.conns .proc { width: 124px; font-weight: 700; }
.dim { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 6px; }

/* incidents */
.events { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; font-size: 14px; font-variant-numeric: tabular-nums; }
.events li { display: grid; grid-template-columns: 78px 100px 104px 1fr; gap: 12px; padding: 7px 4px; border-top: 1px solid var(--line); align-items: center; }
.events li:first-child { border-top: 0; }
.events time { color: var(--muted); }
.events .host { color: var(--ink-2); font-weight: 700; }

/* overview: hosts with system stats stacked on the left, log watchdog pinned on the right.
   Sized to fill the first screen so a kiosk shows all of it without scrolling. */
.overview { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 24px;
  height: calc(100vh - var(--hh, 86px) - 52px); min-height: 640px; }
.overview.no-wd { grid-template-columns: minmax(0, 1fr); }
.overview[hidden], .wd[hidden] { display: none; }
.sys-col { display: grid; grid-auto-rows: minmax(0, 1fr); gap: 24px; min-height: 0; }
.sys { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sys .host-head { margin-bottom: 10px; }
.sys .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 12px; }
.sys .tile .n { font-size: 22px; }
.tile .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minor { font: 500 14px var(--pixel); margin: 2px 0 6px; color: var(--ink-2); }
.disks { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto auto; gap: 6px 12px; align-items: center;
  font-size: 13.5px; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
.disks .mnt { font-weight: 700; white-space: nowrap; }
.disks .pct { font-weight: 700; text-align: right; }
.disks .of { color: var(--muted); white-space: nowrap; }
.bar { height: 12px; background: var(--panel-2); box-shadow: 0 0 0 2px var(--edge); }
.bar i { display: block; height: 100%; }
.svcs { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px; margin-bottom: 10px; }
.svcs .status { font-weight: 700; }
.svcs .state { color: var(--muted); font-weight: 400; }
.pingline { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); }
/* stats on the left, network graphs on the right */
.sys-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; }
.sys-stats { min-width: 0; overflow: hidden; }
.sys-charts { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.sys-charts .chart-title { margin: 0 0 2px; font-size: 12px; gap: 10px; }
.sys-charts .chart-title + canvas + .chart-title { margin-top: 8px; }
.sys-charts canvas { flex: 1 1 0; min-height: 56px; height: auto; }

.wd { display: flex; flex-direction: column; min-height: 0; }
.wd.sev-High { --e: var(--critical); }
.wd.sev-Medium { --e: var(--warning); }
.wd-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.wd-head h2 { margin: 0; font-size: 16px; }
.sevchip { font: 700 12px/1 var(--read); padding: 5px 9px; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 0 0 2px var(--edge); background: var(--panel-2); color: var(--ink); }
.sevchip.High { background: var(--critical); color: #241a33; }
.sevchip.Medium { background: var(--warning); color: #241a33; }
.wd-when { color: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
.wd-stale { background: var(--warning); color: #241a33; font-weight: 700; font-size: 11.5px; padding: 7px 10px; margin-bottom: 10px;
  box-shadow: 0 0 0 2px var(--edge); }
.wd-meta { color: var(--muted); font-size: 10.5px; margin-bottom: 8px; }
.wd-summary { font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 12px;
  max-height: 45%; overflow: auto; }
.wd .minor { font-size: 12px; }
.wd-rules { flex: 1; min-height: 80px; margin: 0; overflow: auto; background: var(--panel-2); padding: 8px 10px;
  border-top: 1px solid var(--line); font: 10.5px/1.5 ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.wd-empty { color: var(--muted); }

@media (max-width: 1100px) {
  .overview { grid-template-columns: 1fr; height: auto; min-height: 0; }
  .sys-col { grid-auto-rows: auto; }
  .sys-body { grid-template-columns: 1fr; }
  .sys-charts canvas { flex: none; height: 110px; }
  .sys .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .wd-summary { max-height: none; }
  .wd-rules { max-height: 420px; }
}

#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--panel); color: var(--ink);
  padding: 8px 11px; font-size: 13px; display: none; font-variant-numeric: tabular-nums; min-width: 160px; }
#tip .when { color: var(--muted); margin-bottom: 4px; font-size: 12px; }
#tip .row { display: flex; align-items: center; gap: 7px; }
#tip .row span:last-child { margin-left: auto; padding-left: 14px; font-weight: 700; }

@media (prefers-reduced-motion: reduce) { .seg button:active, .tbtn:active { transform: none; } }
@media (max-width: 640px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .hosts { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .tile:nth-child(3) { border-left: 0; }
  .events li { grid-template-columns: 70px 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="plate">
    <div><h1>PixelPing</h1><div class="strap" id="strap">network monitor</div></div>
  </div>
  <div class="plate"><span class="conn" id="conn"><span class="status"><span class="dot" style="background:var(--muted)"></span>connecting…</span></span></div>
  <span class="spacer"></span>
  <span class="seg" id="range" role="group" aria-label="Time range">
    <button data-s="60">1 min</button><button data-s="300" aria-pressed="true">5 min</button><button data-s="900">15 min</button>
  </span>
  <button class="tbtn" id="theme" title="Switch light / dark">☾ Dark</button>
</header>
<main>
  <section class="overview" id="overview">
    <div class="sys-col" id="sys"></div>
    <section class="panel wd" id="wd" aria-live="polite">
      <div class="wd-head"><h2>Log watchdog</h2><span class="sevchip" id="wd-sev">No report</span>
        <span class="spacer"></span><span class="wd-when" id="wd-when"></span></div>
      <div class="wd-stale" id="wd-stale" hidden></div>
      <div class="wd-meta" id="wd-meta"></div>
      <div class="wd-summary" id="wd-summary"></div>
      <div class="minor">Rule output <small class="sub" id="wd-count"></small></div>
      <pre class="wd-rules" id="wd-rules"></pre>
    </section>
  </section>
  <section class="panel">
    <h2>Connection health<small>last 60 seconds</small></h2>
    <div class="table-wrap"><table class="health" id="health"></table></div>
  </section>
  <section class="hosts" id="hosts"></section>
  <section class="panel">
    <h2>Incidents</h2>
    <ul class="events" id="events"></ul>
  </section>
</main>
<div id="tip"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// ping target labels come from config: host label by IP, plus the optional "labels" map
const tname = t => state.labels[t] || (t === "gateway" ? "Router" : t);
const STATUS = {
  good: ["--good", "✓", "Healthy"], warning: ["--warning", "!", "Warning"],
  serious: ["--serious", "▲", "Degraded"], critical: ["--critical", "✕", "Down"],
};
let rangeSec = 300;
const state = { hosts: {}, order: [], events: [], targets: [], labels: {} };

/* ------------------------------------------------------------ theme + pixel art */
const THEME_KEY = "pixelping-theme";
const theme = () => document.documentElement.dataset.theme;
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#theme").textContent = t === "dark" ? "☀ Light" : "☾ Dark";
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  paintArt();
  drawAll();
}
// each host gets a planet: a host named after one (e.g. "saturn") is drawn as it, others are Earth
const WORLDS = ["mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto"];
const worldOf = h => WORLDS.find(w => new RegExp(`\\b${w}\\b`, "i").test(`${h.label} ${h.name}`)) || "earth";
const planetUrl = (h, size) => window.Pixel ? Pixel.planet({ name: worldOf(h) }, size) : "";
function paintArt() {
  if (!window.Pixel) return;
  const head = $("header"), SCALE = 2;
  const w = Math.ceil(head.clientWidth / SCALE), hh = Math.ceil(head.clientHeight / SCALE);
  // planets sit in the free stretch between the status plate and the buttons
  const conn = $("#conn").closest(".plate").getBoundingClientRect(), range = $("#range").getBoundingClientRect();
  const gap = [Math.round((conn.right + 24) / SCALE), Math.round((range.left - 24) / SCALE)];
  const worlds = state.order.map(n => ({ name: worldOf(state.hosts[n]) }));
  head.style.setProperty("--banner", `url(${Pixel.banner(w, hh, theme(), worlds, gap)})`);
  for (const n of state.order) {
    const h = state.hosts[n];
    if (h.el) $(".host-head img", h.el).src = planetUrl(h, 40);
    if (h.sysEl) $(".host-head img", h.sysEl).src = planetUrl(h, 40);
  }
  renderHealth();
}

function fmtBps(b) {
  if (b == null) return ["–", ""];
  if (b >= 1e9) return [(b / 1e9).toFixed(2), "Gbps"];
  if (b >= 1e6) return [(b / 1e6).toFixed(b >= 1e8 ? 0 : 1), "Mbps"];
  if (b >= 1e3) return [(b / 1e3).toFixed(0), "kbps"];
  return [b.toFixed(0), "bps"];
}
const bpsText = b => fmtBps(b).join(" ");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], { hour12: false });
function statusBadge(sev, label) {
  const [v, icon, def] = STATUS[sev];
  return `<span class="status"><span class="dot" style="background:var(${v})"></span>${icon} ${label || def}</span>`;
}

/* ------------------------------------------------------------ pixel charts */
// Everything inside the plot snaps to a grid of P x P "pixels": stepped lines, dotted gridlines,
// a dithered fill under the first series and dithered bands where pings were lost.
// Axis labels are normal text so they stay crisp and readable.
const P = 3;
const charts = [];
let hoverTs = null;
const patterns = new Map();
function dither(g, color, kind) {
  const key = color + kind;
  if (!patterns.has(key)) {
    const c = document.createElement("canvas");
    c.width = c.height = P * 2;
    const x = c.getContext("2d");
    x.fillStyle = color;
    x.fillRect(0, 0, P, P);
    if (kind === "dense") x.fillRect(P, P, P, P);
    patterns.set(key, c);
  }
  return g.createPattern(patterns.get(key), "repeat");
}

function makeChart(canvas, cfg) {
  const ch = { canvas, ...cfg };
  charts.push(ch);
  canvas.addEventListener("mousemove", e => {
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left;
    const { x0, x1, t0, t1 } = ch.geom || {};
    if (!ch.geom || x < x0 || x > x1) return hideTip();
    hoverTs = t0 + (x - x0) / (x1 - x0) * (t1 - t0);
    drawAll();
    showTip(ch, e.clientX, e.clientY);
  });
  canvas.addEventListener("mouseleave", hideTip);
  return ch;
}
function hideTip() { hoverTs = null; $("#tip").style.display = "none"; drawAll(); }

function nearest(samples, ts) {
  let best = null, bd = Infinity;
  for (let i = samples.length - 1; i >= 0; i--) {
    const d = Math.abs(samples[i].ts - ts);
    if (d < bd) { bd = d; best = samples[i]; } else if (samples[i].ts < ts) break;
  }
  return bd < 3 ? best : null;
}

function showTip(ch, cx, cy) {
  const s = nearest(ch.samples(), hoverTs);
  const tip = $("#tip");
  if (!s) { tip.style.display = "none"; return; }
  let html = `<div class="when">${clock(s.ts)}</div>`;
  for (const se of ch.series) {
    const v = se.get(s);
    html += `<div class="row"><span class="legend"><i style="background:var(${se.color})"></i></span><span>${se.name}</span><span>${v == null ? (se.lostText?.(s) || "–") : ch.fmt(v)}</span></div>`;
  }
  tip.innerHTML = html;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(cx + 16, innerWidth - w - 10) + "px";
  tip.style.top = Math.max(10, cy - h - 14) + "px";
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function drawChart(ch) {
  const cv = ch.canvas, dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, W, H);
  const samples = ch.samples();
  const t1 = Date.now() / 1000, t0 = t1 - rangeSec;
  const vis = samples.filter(s => s.ts >= t0 - 1);
  let max = ch.minMax;
  for (const s of vis) for (const se of ch.series) { const v = se.get(s); if (v != null && v > max) max = v; }
  max = niceMax(max * 1.05);
  g.font = `12px ${css("--read")}`;
  const lw = Math.max(...[0, .5, 1].map(f => g.measureText(ch.axisFmt(max * f)).width));
  // plot area in whole grid cells
  const x0 = Math.ceil((lw + 12) / P) * P, y1 = P * 3;
  const cols = Math.floor((W - 4 - x0) / P), rows = Math.floor((H - 20 - y1) / P);
  const x1 = x0 + cols * P, y0 = y1 + rows * P;
  ch.geom = { x0, x1, t0, t1 };
  const gx = t => Math.round((t - t0) / (t1 - t0) * (cols - 1));
  const gy = v => Math.round((1 - Math.min(v, max) / max) * (rows - 1));
  const cell = (x, y) => g.fillRect(x0 + x * P, y1 + y * P, P, P);

  // dotted gridlines + labels
  g.textAlign = "right"; g.textBaseline = "middle";
  for (const f of [0, .5, 1]) {
    const y = gy(max * f);
    g.fillStyle = f === 0 ? css("--axis") : css("--grid");
    if (f === 0) g.fillRect(x0, y1 + y * P, cols * P, P);
    else for (let x = 0; x < cols; x += 2) cell(x, y);
    g.fillStyle = css("--muted");
    g.fillText(ch.axisFmt(max * f), x0 - 8, y1 + y * P + P / 2);
  }
  g.textAlign = "center"; g.textBaseline = "top";
  const step = rangeSec <= 60 ? 15 : rangeSec <= 300 ? 60 : 300;
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
    const x = x0 + gx(t) * P;
    if (x < x0 + 24 || x > x1 - 24) continue;
    g.fillText(new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: rangeSec <= 60 ? "2-digit" : undefined, hour12: false }), x, y0 + 5);
  }

  // packet loss: dithered full-height bands
  if (ch.lossOf) {
    g.fillStyle = dither(g, css("--critical"), "dense");
    g.globalAlpha = .45;
    const wcols = Math.max(1, Math.round(cols / rangeSec));
    for (const s of vis) if (ch.lossOf(s) && s.ts >= t0) g.fillRect(x0 + gx(s.ts) * P, y1, wcols * P, rows * P);
    g.globalAlpha = 1;
  }

  // series: points on the grid, joined with stepped (Bresenham) lines; gaps on null / >3s holes
  ch.series.forEach((se, si) => {
    const pts = [];
    let run = [];
    for (const s of vis) {
      const v = se.get(s);
      if (v == null || (run.length && s.ts - run[run.length - 1].ts > 3)) { if (run.length) pts.push(run); run = []; }
      if (v != null && s.ts >= t0) run.push({ ts: s.ts, x: gx(s.ts), y: gy(v) });
    }
    if (run.length) pts.push(run);
    const color = css(se.color);
    // dithered area under the first series only, so overlapping series stay readable
    if (si === 0 && ch.fill) {
      g.fillStyle = dither(g, color, "light");
      g.globalAlpha = .32;
      for (const r of pts) for (let i = 0; i < r.length; i++) {
        const a = r[i], b = r[i + 1] || a;
        for (let x = a.x; x <= b.x; x++) {
          const y = b.x === a.x ? a.y : Math.round(a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x));
          g.fillRect(x0 + x * P, y1 + (y + 1) * P, P, (rows - y - 1) * P);
        }
      }
      g.globalAlpha = 1;
    }
    g.fillStyle = color;
    for (const r of pts) {
      if (r.length === 1) cell(r[0].x, r[0].y);
      for (let i = 1; i < r.length; i++) line(r[i - 1].x, r[i - 1].y, r[i].x, r[i].y, cell);
    }
  });

  // crosshair: dotted column + chunky markers
  if (hoverTs != null && hoverTs >= t0) {
    const s = nearest(samples, hoverTs);
    if (s) {
      const x = gx(s.ts);
      g.fillStyle = css("--axis");
      for (let y = 0; y < rows; y += 2) cell(x, y);
      for (const se of ch.series) {
        const v = se.get(s); if (v == null) continue;
        const y = gy(v);
        g.fillStyle = css("--edge"); g.fillRect(x0 + (x - 2) * P, y1 + (y - 2) * P, P * 5, P * 5);
        g.fillStyle = css(se.color); g.fillRect(x0 + (x - 1) * P, y1 + (y - 1) * P, P * 3, P * 3);
      }
    }
  }
}
function line(xa, ya, xb, yb, plot) {
  const dx = Math.abs(xb - xa), dy = -Math.abs(yb - ya), sx = xa < xb ? 1 : -1, sy = ya < yb ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    plot(xa, ya);
    if (xa === xb && ya === yb) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; xa += sx; }
    if (e2 <= dx) { err += dx; ya += sy; }
  }
}
function drawAll() { charts.forEach(drawChart); }

/* ------------------------------------------------------------ rendering */
const PING_COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5"];

function buildHost(h) {
  const el = document.createElement("article");
  el.className = "panel";
  el.innerHTML = `
    <div class="host-head"><img alt=""><h3>${esc(h.label)}</h3><span class="meta"></span><span class="offline"></span></div>
    <div class="tiles">
      <div class="tile"><div class="k"><i class="dot" style="background:var(--s1)"></i>Download</div><div class="n rx">–</div></div>
      <div class="tile"><div class="k"><i class="dot" style="background:var(--s2)"></i>Upload</div><div class="n tx">–</div></div>
      <div class="tile"><div class="k">TCP retransmits</div><div class="n re">–</div></div>
      <div class="tile"><div class="k">CPU load</div><div class="n ld">–</div></div>
    </div>
    <div class="chart-title"><b>Throughput</b>
      <span class="legend"><i style="background:var(--s1)"></i>Download</span>
      <span class="legend"><i style="background:var(--s2)"></i>Upload</span></div>
    <canvas class="tp"></canvas>
    <div class="chart-title lat-title"><b>Ping latency</b></div>
    <canvas class="lat"></canvas>
    <table class="conns"><thead><tr><th class="proc">Process</th><th>Remote</th><th class="num">↓ Down</th><th class="num">↑ Up</th></tr></thead><tbody></tbody></table>`;
  $("#hosts").appendChild(el);
  h.el = el;
  $(".host-head img", el).src = planetUrl(h, 40);
  h.pingLabels = Object.keys(h.live.targets || {}).length ? Object.keys(h.live.targets) : state.targets;
  netCharts(h, el);
}

// throughput + ping latency charts for a host, inside any element with .tp/.lat canvases and a .lat-title
function netCharts(h, el) {
  const samples = () => h.samples, labels = h.pingLabels;
  makeChart($(".tp", el), {
    samples, minMax: 1e6, fmt: bpsText, axisFmt: bpsText, fill: true,
    series: [{ name: "Download", color: "--s1", get: s => s.rx }, { name: "Upload", color: "--s2", get: s => s.tx }],
  });
  $(".lat-title", el).innerHTML = "<b>Ping latency</b>" + labels.map((l, i) =>
    `<span class="legend"><i style="background:var(${PING_COLORS[i]})"></i>${esc(tname(l))}</span>`).join("") +
    `<span class="legend"><i class="band" style="background:var(--critical)"></i>Packet loss</span>`;
  makeChart($(".lat", el), {
    samples, minMax: 5, fmt: v => v.toFixed(1) + " ms", axisFmt: v => (v < 10 ? +v.toFixed(1) : Math.round(v)) + " ms",
    lossOf: s => Object.values(s.lost || {}).some(x => x > 0),
    series: labels.map((l, i) => ({ name: tname(l), color: PING_COLORS[i], get: s => s.ping?.[l] ?? null,
      lostText: s => s.lost?.[l] ? "lost" : null })),
  });
}

function renderHost(h) {
  const el = h.el, live = h.live, last = h.samples.at(-1);
  $(".meta", el).textContent = live.iface ? `${live.iface}${live.speed ? " · " + live.speed + " Mbps link" : ""}` : "";
  $(".offline", el).textContent = live.online ? "" : "✕ collector offline" + (live.error ? `: ${live.error}` : "");
  const fresh = live.online && last;
  const put = (cls, [n, u]) => $(cls, el).innerHTML = `${n}<span class="u">${u}</span>`;
  put(".rx", fresh ? fmtBps(last.rx) : ["–", ""]);
  put(".tx", fresh ? fmtBps(last.tx) : ["–", ""]);
  put(".re", fresh ? [last.retrans.toFixed(1), "%"] : ["–", ""]);
  put(".ld", fresh ? [last.load.toFixed(2), ""] : ["–", ""]);
  const tb = $(".conns tbody", el);
  const rows = (live.conns || []).slice(0, 8);
  tb.innerHTML = rows.length ? rows.map(c => {
    const ip = c.peer.replace(/:\d+$/, "").replace(/^\[|\]$/g, "");
    const port = c.peer.match(/:(\d+)$/)?.[1];
    const remote = c.peer_name ? `${esc(c.peer_name)} <span class="dim">${ip}</span>` : ip;
    return `<tr><td class="proc" title="${esc(c.proc)}">${esc(c.proc || (/:22$/.test(c.local) ? "sshd" : "(other user)"))}</td>
      <td title="${esc(c.peer)}">${remote}<span class="dim">:${port}</span></td>
      <td class="num">${bpsText(c.rx_bps)}</td><td class="num">${bpsText(c.tx_bps)}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">No active TCP transfers right now</td></tr>`;
}

function pingSeverity(sum, lastRtt) {
  if (!sum || sum.loss_pct == null) return null;
  if (sum.down) return "critical";
  if (sum.loss_pct >= 5) return "serious";
  if (sum.loss_pct > 0) return "warning";
  if (lastRtt != null && sum.baseline != null && lastRtt > Math.max(sum.baseline * 4, sum.baseline + 40)) return "serious";
  return "good";
}

function renderHealth() {
  const allTargets = [...new Set(state.order.flatMap(n => state.hosts[n].pingLabels || []))];
  let html = `<thead><tr><th>From</th>${allTargets.map(t => `<th>→ ${esc(tname(t))}</th>`).join("")}<th>DNS lookup</th></tr></thead><tbody>`;
  for (const n of state.order) {
    const h = state.hosts[n], last = h.samples.at(-1);
    html += `<tr><th><img src="${planetUrl(h, 40)}" alt="">${esc(h.label)}</th>`;
    for (const t of allTargets) {
      const sum = h.live.targets?.[t];
      if (!sum || !h.live.online) { html += `<td class="sub">${h.live.online ? "–" : "offline"}</td>`; continue; }
      const lastRtt = [...h.samples].reverse().find(s => s.ping?.[t] != null)?.ping[t];
      const sev = pingSeverity(sum, last?.ping?.[t]) || "good";
      html += `<td>${statusBadge(sev)}<br><span class="v">${lastRtt != null ? lastRtt.toFixed(1) + " ms" : "–"}</span>
        <span class="sub"> · ${sum.loss_pct.toFixed(0)}% loss${sum.baseline != null ? ` · normal ${sum.baseline.toFixed(1)} ms` : ""}</span></td>`;
    }
    const d = [...h.samples].reverse().find(s => s.dns != null)?.dns;
    html += d == null ? `<td class="sub">–</td>` : d < 0 ? `<td>${statusBadge("critical", "Failing")}</td>`
      : `<td>${statusBadge(d > 1000 ? "serious" : d > 300 ? "warning" : "good")}<br><span class="v">${d.toFixed(0)} ms</span></td>`;
    html += "</tr>";
  }
  $("#health").innerHTML = html + "</tbody>";
}

function renderEvents() {
  const hostLabel = n => state.hosts[n]?.label || n;
  const evs = state.events.slice(-200).reverse();
  $("#events").innerHTML = evs.length ? evs.map(e => `<li><time>${clock(e.ts)}</time><span class="host">${esc(hostLabel(e.host))}</span>
    ${statusBadge(e.severity, { good: "OK", warning: "Warn", serious: "Issue", critical: "Outage" }[e.severity])}
    <span>${esc(e.text.replace(/^(\S+) ping/, (m, t) => tname(t) + " ping"))}</span></li>`).join("")
    : `<li class="empty" style="display:block">No incidents recorded since the monitor started. Outages, latency spikes and DNS failures will be listed here and saved to pixelping/logs/.</li>`;
}

/* ------------------------------------------------------------ system stats panes */
function fmtSize(b) {
  const u = ["B", "K", "M", "G", "T", "P"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (b >= 100 || i === 0 ? b.toFixed(0) : b.toFixed(1)) + u[i];
}
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
const levelOf = (pct, warn, crit) => pct >= crit ? "--critical" : pct >= warn ? "--warning" : "--good";
const SVC_OK = new Set(["active", "online"]);
const SVC_PENDING = new Set(["activating", "reloading", "launching", "deactivating", "stopping"]);

function buildSys(h) {
  const el = document.createElement("article");
  el.className = "panel sys";
  el.innerHTML = `
    <div class="host-head"><img alt=""><h3>${esc(h.label)}</h3><span class="meta"></span><span class="offline"></span></div>
    <div class="tiles">
      <div class="tile"><div class="k">CPU</div><div class="n cpu">–</div><div class="s cores"></div></div>
      <div class="tile"><div class="k">RAM</div><div class="n ram">–</div><div class="s ramp"></div></div>
      <div class="tile"><div class="k">Load avg</div><div class="n load">–</div><div class="s load5"></div></div>
      <div class="tile"><div class="k"><i class="dot" style="background:var(--s1)"></i>In</div><div class="n rx">–</div><div class="s">download</div></div>
      <div class="tile"><div class="k"><i class="dot" style="background:var(--s2)"></i>Out</div><div class="n tx">–</div><div class="s">upload</div></div>
    </div>
    <div class="sys-body">
      <div class="sys-stats">
        <div class="minor">Disks</div><div class="disks"></div>
        <div class="minor">Services</div><div class="svcs"></div>
        <div class="pingline"></div>
      </div>
      <div class="sys-charts">
        <div class="chart-title"><b>Throughput</b>
          <span class="legend"><i style="background:var(--s1)"></i>In</span>
          <span class="legend"><i style="background:var(--s2)"></i>Out</span></div>
        <canvas class="tp"></canvas>
        <div class="chart-title lat-title"></div>
        <canvas class="lat"></canvas>
      </div>
    </div>`;
  $("#sys").appendChild(el);
  h.sysEl = el;
  $("img", el).src = planetUrl(h, 40);
  netCharts(h, el);
}

function renderSys(h) {
  const el = h.sysEl; if (!el) return;
  const st = h.sys?.stats, err = h.sys?.error;
  const stale = !st || Date.now() / 1000 - st.ts > 15;
  $(".offline", el).textContent = err ? `✕ stats unavailable: ${err}` : stale && st ? "✕ stats are stale" : "";
  $(".meta", el).textContent = st ? `up ${fmtUptime(st.uptime)}` : "";
  const put = (cls, n, u = "") => $(cls, el).innerHTML = `${n}<span class="u">${u}</span>`;
  if (st) {
    put(".cpu", st.cpu == null ? "–" : st.cpu.toFixed(0), "%");
    $(".cores", el).textContent = `${st.cores} cores`;
    put(".ram", fmtSize(st.mem.used), "/ " + fmtSize(st.mem.total));
    $(".ramp", el).textContent = `${(100 * st.mem.used / st.mem.total).toFixed(0)}% used`;
    put(".load", st.load[0].toFixed(2));
    $(".load5", el).textContent = `5m ${st.load[1].toFixed(2)} · 15m ${st.load[2].toFixed(2)}`;
    $(".disks", el).innerHTML = st.disks.map(d => d.error
      ? `<span class="mnt">${esc(d.mount)}</span><span class="offline">${esc(d.error)}</span><span></span><span></span>`
      : `<span class="mnt">${esc(d.mount)}</span>
         <span class="bar"><i style="width:${Math.min(100, d.pct).toFixed(1)}%;background:var(${levelOf(d.pct, 80, 90)})"></i></span>
         <span class="pct">${d.pct.toFixed(0)}%</span><span class="of">${fmtSize(d.used)} of ${fmtSize(d.total)}</span>`).join("");
    $(".svcs", el).innerHTML = st.services.map(s => {
      const ok = SVC_OK.has(s.state), sev = ok ? "good" : SVC_PENDING.has(s.state) ? "warning" : "critical";
      const [v, icon] = STATUS[sev];
      return `<span class="status" title="${esc(s.error || "")}"><span class="dot" style="background:var(${v})"></span>${icon} ${esc(s.name)}${ok ? "" : ` <span class="state">${esc(s.state)}</span>`}</span>`;
    }).join("");
  }
  // throughput and pings come from the per-second network collector
  const last = h.samples.at(-1), fresh = h.live.online && last;
  put(".rx", ...(fresh ? fmtBps(last.rx) : ["–", ""]));
  put(".tx", ...(fresh ? fmtBps(last.tx) : ["–", ""]));
  const order = ["good", "warning", "serious", "critical"];
  const problems = [];
  let worst = "good";
  for (const [t, sum] of Object.entries(h.live.targets || {})) {
    const sev = pingSeverity(sum, last?.ping?.[t]);
    if (!sev || sev === "good") continue;
    if (order.indexOf(sev) > order.indexOf(worst)) worst = sev;
    problems.push(`${tname(t)} ${sum.down ? "down" : sum.loss_pct.toFixed(0) + "% loss"}`);
  }
  const n = Object.keys(h.live.targets || {}).length;
  $(".pingline", el).innerHTML = !h.live.online ? statusBadge("critical", "Network collector offline")
    : statusBadge(worst, problems.length ? "Network" : "Network healthy") +
      ` <span class="sub">${problems.length ? esc(problems.join(" · ")) : `${n} ping targets, last 60 s`}</span>`;
}

/* ------------------------------------------------------------ log watchdog pane */
const WD_STALE_S = 2 * 3600;
const SEV_ICON = { High: "▲", Medium: "!", Low: "·", Quiet: "✓" };
function ago(s) {
  if (s < 90) return "just now";
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
  return h < 48 ? `${h} h ${m} min ago` : `${Math.floor(h / 24)} days ago`;
}
// Everything from the report is untrusted (it quotes log lines): textContent only.
function renderWatchdog() {
  const r = state.watchdog, now = Date.now() / 1000;
  const sev = $("#wd-sev"), stale = $("#wd-stale");
  $("#wd").className = "panel wd" + (r ? " sev-" + r.severity : "");
  if (!r) {
    sev.className = "sevchip"; sev.textContent = "No report";
    $("#wd-when").textContent = "";
    $("#wd-meta").textContent = "";
    $("#wd-summary").textContent = "";
    $("#wd-count").textContent = "";
    $("#wd-rules").textContent = "";
    stale.hidden = false;
    stale.textContent = state.watchdogEnabled
      ? "⚠ Watchdog stale: no report received yet. Waiting for the first push."
      : "⚠ Watchdog listener is not configured on this pixelping instance.";
    return;
  }
  sev.className = "sevchip " + r.severity;
  sev.textContent = `${SEV_ICON[r.severity] || ""} ${r.severity}`;
  const t = new Date(r.ts);
  const when = isNaN(t) ? r.ts : t.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  $("#wd-when").textContent = `Last checked ${when} (${ago(now - r.received)})`;
  const age = now - r.received;
  stale.hidden = age <= WD_STALE_S;
  stale.textContent = `⚠ Watchdog stale: no report for ${ago(age).replace(" ago", "")}. Check the watchdog sender.`;
  const meta = [];
  if (r.hosts?.length) meta.push("Hosts: " + r.hosts.join(", "));
  meta.push(`${r.suppressed} suppressed`);
  $("#wd-meta").textContent = meta.join(" · ");
  const summary = $("#wd-summary");
  summary.textContent = r.summary || (r.severity === "Quiet" ? "Quiet hour: nothing notable in the logs." : "No summary in this report.");
  summary.classList.toggle("wd-empty", !r.summary);
  const more = (r.rules_total || r.rules.length) - r.rules.length;
  $("#wd-count").textContent = r.rules.length ? `${r.rules.length} line${r.rules.length === 1 ? "" : "s"}` : "";
  const rules = $("#wd-rules");
  rules.textContent = r.rules.length ? r.rules.join("\n") + (more > 0 ? `\n... ${more} more not shown` : "") : "No rules fired.";
  rules.classList.toggle("wd-empty", !r.rules.length);
}

function sizeOverview() {
  document.documentElement.style.setProperty("--hh", $("header").offsetHeight + "px");
}

/* ------------------------------------------------------------ data */
async function init() {
  const snap = await (await fetch("/api/snapshot")).json();
  state.targets = snap.targets;
  state.labels = snap.labels || {};
  state.events = snap.events;
  state.watchdog = snap.watchdog;
  state.watchdogEnabled = snap.watchdog_enabled;
  for (const h of snap.hosts) {
    state.hosts[h.name] = h; state.order.push(h.name);
    buildHost(h); renderHost(h);
    if (h.sys) { buildSys(h); renderSys(h); }
  }
  if (!state.watchdogEnabled) { $("#wd").hidden = true; $("#overview").classList.add("no-wd"); }
  $("#overview").hidden = !state.watchdogEnabled && !snap.hosts.some(h => h.sys);
  $("#strap").textContent = "network monitor · " + state.order.map(n => state.hosts[n].label).join(" · ");
  sizeOverview();
  renderHealth(); renderEvents(); renderWatchdog(); paintArt(); drawAll();
  connect();
}

function connect() {
  const es = new EventSource("/api/stream");
  const setConn = (ok, text) => $("#conn").innerHTML = `<span class="status"><span class="dot" style="background:var(${ok ? "--good" : "--critical"})"></span>${text}</span>`;
  es.onopen = () => setConn(true, "Live");
  es.onerror = () => setConn(false, "Dashboard server unreachable, retrying");
  let dirty = false;
  es.onmessage = m => {
    const msg = JSON.parse(m.data);
    if (msg.type === "sample") {
      const h = state.hosts[msg.host]; if (!h) return;
      if (msg.sample) { h.samples.push(msg.sample); if (h.samples.length > 900) h.samples.shift(); }
      h.live = msg.live;
      dirty = true;
    } else if (msg.type === "event") {
      state.events.push(msg.event); renderEvents();
    } else if (msg.type === "stats") {
      const h = state.hosts[msg.host]; if (!h) return;
      h.sys = { stats: msg.stats, error: msg.error };
      dirty = true;
    } else if (msg.type === "watchdog") {
      state.watchdog = msg.watchdog; renderWatchdog();
    }
  };
  setInterval(() => {
    if (dirty) {
      state.order.forEach(n => { renderHost(state.hosts[n]); renderSys(state.hosts[n]); });
      renderHealth(); dirty = false;
    }
    drawAll();
  }, 1000);
  setInterval(renderWatchdog, 30000);   // keeps "N min ago" and the stale warning current
}

$("#range").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  rangeSec = +b.dataset.s;
  $("#range").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  drawAll();
});
$("#theme").addEventListener("click", () => setTheme(theme() === "dark" ? "light" : "dark"));
let resizeT;
addEventListener("resize", () => { sizeOverview(); drawAll(); clearTimeout(resizeT); resizeT = setTimeout(paintArt, 150); });
// theme: saved choice, else follow the system
let saved = null;
try { saved = localStorage.getItem(THEME_KEY); } catch {}
document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
$("#theme").textContent = theme() === "dark" ? "☀ Light" : "☾ Dark";
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => { if (!saved) setTheme(e.matches ? "dark" : "light"); });
document.fonts?.ready.then(() => { paintArt(); drawAll(); });
init();
</script>
</body>
</html>
